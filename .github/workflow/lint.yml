name: Lint

on:
  pull_request:
  push:
    branches:
      - main
      - development
      - feature/**
      - feat/**
      - fix/**

jobs:
  golangci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: backend