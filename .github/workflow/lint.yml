name: Lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'
      - name: Check formatting
        working-directory: backend
        run: gofmt -w ./... && git diff --exit-code
