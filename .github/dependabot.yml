# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json

version: 2

updates:
  - package-ecosystem: "gomod"
    directory: "/backend"

    schedule:
      interval: weekly

    open-pull-requests-limit: 10

    commit-message:
      prefix: deps

  - package-ecosystem: "github-actions"
    directory: "/"

    schedule:
      interval: weekly

    open-pull-requests-limit: 5

    commit-message:
      prefix: ci