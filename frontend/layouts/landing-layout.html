<!--
  IDINEX — Landing layout (reference shell)

  This is the pattern every marketing-style page follows:
  navbar + footer are shared partials injected by js/components/include-loader.js,
  so only the <main> content changes per page. Copy this file's
  <head>/<body> skeleton when adding a new landing-style page
  (see index.html for a filled-in example).
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Idinex</title>

  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/typography.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/buttons.css" />
  <link rel="stylesheet" href="../css/navbar.css" />
  <link rel="stylesheet" href="../css/utilities.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>

  <div data-include="../components/navbar.html"></div>

  <main>
    <!-- Page-specific content goes here -->
  </main>

  <div data-include="../components/footer.html"></div>

  <script type="module">
    import { initIncludes } from "../js/components/include-loader.js";
    initIncludes();
  </script>
</body>
</html>
